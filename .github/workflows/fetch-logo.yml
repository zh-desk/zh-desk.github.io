name: fetch-logo (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the ZeroHedge header logo
        run: |
          mkdir -p tmp-logo
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          curl -sSL -A "$UA" https://www.zerohedge.com/ -o tmp-logo/home.html || true
          grep -oiE '(src|href|content)="[^"]*(logo|favicon|apple-touch|og-image|\.svg)[^"]*"' tmp-logo/home.html | sort -u > tmp-logo/candidates.txt || true
          grep -oiE '<svg[^>]*class="[^"]*[Ll]ogo[^"]*"[\s\S]{0,40000}?</svg>' tmp-logo/home.html | head -c 200000 > tmp-logo/inline-svg.txt || true
          python3 - <<'PY'
          import re, html, urllib.parse, subprocess
          t = open('tmp-logo/home.html', encoding='utf-8', errors='replace').read()
          urls = set()
          for m in re.finditer(r'(?:src|href|content)="([^"]+)"', t):
              u = html.unescape(m.group(1))
              if re.search(r'logo|favicon|apple-touch|\.svg', u, re.I):
                  urls.add(urllib.parse.urljoin('https://www.zerohedge.com/', u))
          i = 0
          for u in sorted(urls):
              if not u.startswith('http'): continue
              i += 1
              ext = (re.search(r'\.(svg|png|jpe?g|webp|ico|gif)', u.split('?')[0], re.I) or [None, 'bin'])[1]
              subprocess.run(['curl', '-sSL', '-A', 'Mozilla/5.0', u, '-o', 'tmp-logo/f%02d.%s' % (i, ext)])
              open('tmp-logo/urls.txt', 'a').write('f%02d.%s %s\n' % (i, ext, u))
          # also every inline <svg> in the header area
          for k, m in enumerate(re.finditer(r'<svg[\s\S]*?</svg>', t[:400000])):
              if k > 30: break
              open('tmp-logo/inline-%02d.svg' % k, 'w').write(m.group(0))
          PY
          ls -la tmp-logo
      - name: Commit what came back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tmp-logo
          git commit -m "One-off: ZeroHedge logo candidates" || exit 0
          git push
